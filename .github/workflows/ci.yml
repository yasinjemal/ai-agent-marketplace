# =============================================================
# CI Pipeline — Lint, Type-Check, Build
# Runs on push to main/master and on pull requests.
# =============================================================

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"

jobs:
  ci:
    name: Lint → Type-Check → Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          # Build-time env vars (dummy values for CI)
          DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"
          CLERK_SECRET_KEY: "sk_test_ci_placeholder"
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: "pk_test_ci_placeholder"
          NEXT_PUBLIC_APP_URL: "https://ci.example.com"
          PAYFAST_MERCHANT_ID: "ci_merchant"
          PAYFAST_MERCHANT_KEY: "ci_key"
